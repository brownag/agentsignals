[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-signals"
version = "0.2.0"
description = "Lightweight background daemon and CLI toolkit to monitor ephemeral Claude Code sessions and distill behavioral memories."
readme = "README.md"
authors = [
    {name = "Andrew Brown", email = "brown.andrewg@gmail.com"},
]
license = {text = "MIT"}
keywords = ["claude", "agent", "memory", "daemon", "cli", "systemd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
agent-signals = "agentsignals.cli:main"
claudalizer = "agentsignals.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentsignals*"]
